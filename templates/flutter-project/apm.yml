# apm.yml — Flutter Project Template
# Copy file này vào thư mục gốc của dự án Flutter/Android/iOS

name: my-flutter-app           # ← Đổi tên dự án
version: 1.0.0

skills:
  # --- coding ---
  - name: dart-flutter-review
    description: Quy chuẩn Flutter
    path: ~/Desktop/skills/features/dart/skills/flutter/flutter-code-review.md
    activate:
      include: ["**/*.dart"]

  - name: riverpod-patterns
    description: Patterns chuẩn cho Riverpod
    path: ~/Desktop/skills/features/dart/skills/flutter/riverpod-patterns.md
    activate:
      include: ["**/*.dart"]

  - name: git-workflow
    description: Git workflow chuẩn
    path: ~/Desktop/skills/features/workflow/skills/git-workflow.md
    activate:
      always: true

  # --- structure ---
  - name: clean-architecture
    description: Clean Architecture guide
    path: ~/Desktop/skills/features/structure/skills/architecture/clean-architecture.md
    activate:
      always: true

  # --- testing ---
  - name: unit-test-guide
    description: Hướng dẫn viết unit test
    path: ~/Desktop/skills/features/testing/skills/unit-test-guide.md
    activate:
      include: ["**/*_test.dart"]

mcpServers:
  serena:
    command: uvx
    args:
      - "--from"
      - "git+https://github.com/oraios/serena"
      - "serena"
      - "start-mcp-server"
    transport: stdio

  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    transport: stdio
    env:
      CONTEXT7_API_KEY: "ctx7sk-31f118e9-1ca9-4dfc-8a59-4cd58ec0a630"
