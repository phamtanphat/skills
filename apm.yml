# ═══════════════════════════════════════════════════════════════
# APM.YML — AI Package Manager Config
# Entry point cho toàn bộ hệ thống skills & MCP
# ═══════════════════════════════════════════════════════════════
name: my-ai-skills
version: 2.0.0
description: Bộ kỹ năng đa ngôn ngữ và công cụ MCP tích hợp

# ───────────────────────────────────────────────────────────────
# SKILLS — Hướng dẫn & quy chuẩn cho AI
# ───────────────────────────────────────────────────────────────
skills:

  # --- Ngôn ngữ lập trình ---
  - name: dart-flutter-review
    description: Quy chuẩn Riverpod, Clean Architecture cho Flutter
    path: ./skills/languages/dart/flutter/flutter-code-review.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-bloc-firebase
    description: "cursor.directory: Flutter + Bloc/Cubit + Firebase rules"
    path: ./skills/languages/dart/flutter/rules-bloc-firebase.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-clean-arch-bloc
    description: "cursor.directory: Clean Architecture + Feature-First + flutter_bloc (with Dartz, GetIt)"
    path: ./skills/languages/dart/flutter/rules-clean-arch-bloc.md
    activate:
      include: ["**/*.dart"]

  - name: dart-general-rules
    description: "cursor.directory: Senior Dart guidelines + Riverpod/getIt/AutoRoute Flutter principles"
    path: ./skills/languages/dart/flutter/rules-dart-general.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-provider-bloc
    description: "cursor.directory: Provider (ephemeral) + Bloc (app state) + private widget classes"
    path: ./skills/languages/dart/flutter/rules-provider-bloc.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-riverpod-supabase
    description: "cursor.directory: Flutter + Riverpod + Supabase rules"
    path: ./skills/languages/dart/flutter/rules-riverpod-supabase.md
    activate:
      include: ["**/*.dart"]

  - name: python-review
    description: Quy chuẩn PEP8 và xử lý logic cho Python
    path: ./skills/languages/python/code-review.md
    activate:
      include: ["**/*.py"]

  - name: javascript-review
    description: Quy chuẩn React/TypeScript
    path: ./skills/languages/javascript/react-patterns.md
    activate:
      include: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx"]

  # --- Workflow & Quy trình ---
  - name: git-workflow
    description: Quy trình Git chuẩn (branch, commit, PR)
    path: ./skills/workflow/git-workflow.md
    activate:
      always: true

  - name: code-review-process
    description: Quy trình review code
    path: ./skills/workflow/code-review-process.md
    activate:
      always: true

  # --- Kiến trúc ---
  - name: clean-architecture
    description: Hướng dẫn Clean Architecture
    path: ./skills/architecture/clean-architecture.md
    activate:
      always: true

  # --- Testing ---
  - name: unit-test-guide
    description: Hướng dẫn viết unit test
    path: ./skills/testing/unit-test-guide.md
    activate:
      include: ["**/*_test.*", "**/*.test.*", "**/test/**"]

  # --- DevOps ---
  - name: docker-guide
    description: Hướng dẫn Docker & container
    path: ./skills/devops/docker-guide.md
    activate:
      include: ["**/Dockerfile", "**/docker-compose*.yml"]

# ───────────────────────────────────────────────────────────────
# MCP SERVERS — Công cụ cho AI sử dụng
# Docs cho từng MCP: xem thư mục ./mcps/
mcpServers:

  # ══════════════════════════════
  # CODE TOOLS
  # ══════════════════════════════

  # Serena — Code intelligence, symbol search, refactoring
  # Docs: ./mcps/code-tools/serena.md
  serena:
    command: uvx
    args:
      - "--from"
      - "git+https://github.com/oraios/serena"
      - "serena"
      - "start-mcp-server"
    transport: stdio

  # Context7 — Library documentation fetcher (no hallucination)
  # Docs: ./mcps/code-tools/context7.md
  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    transport: stdio
    env:
      CONTEXT7_API_KEY: "ctx7sk-31f118e9-1ca9-4dfc-8a59-4cd58ec0a630"

  # GitHub — Repository management, issues, PRs (Official MCP)
