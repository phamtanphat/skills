# apm.yml — Flutter Project Template
# Copy file này vào thư mục gốc của dự án Flutter

name: my-flutter-app           # ← Đổi tên dự án
version: 1.0.0

# Kế thừa từ global (nếu có)
# extends:
#   - "~/Desktop/skills/apm.yml"

skills:
  # Skills cần thiết cho Flutter project
  - name: dart-flutter-review
    description: Quy chuẩn Riverpod và UI cho Flutter
    path: ~/Desktop/skills/skills/languages/dart/flutter-code-review.md
    activate:
      include: ["**/*.dart"]

  - name: riverpod-patterns
    description: Patterns chuẩn cho Riverpod
    path: ~/Desktop/skills/skills/languages/dart/riverpod-patterns.md
    activate:
      include: ["**/*.dart"]

  - name: clean-architecture
    description: Clean Architecture guide
    path: ~/Desktop/skills/skills/architecture/clean-architecture.md
    activate:
      always: true

  - name: git-workflow
    description: Git workflow chuẩn
    path: ~/Desktop/skills/skills/workflow/git-workflow.md
    activate:
      always: true

  - name: unit-test-guide
    description: Hướng dẫn viết unit test
    path: ~/Desktop/skills/skills/testing/unit-test-guide.md
    activate:
      include: ["**/*_test.dart"]

mcpServers:
  serena:
    command: uvx
    args:
      - "--from"
      - "git+https://github.com/oraios/serena"
      - "serena"
      - "start-mcp-server"
    transport: stdio

  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    transport: stdio
    env:
      CONTEXT7_API_KEY: "ctx7sk-31f118e9-1ca9-4dfc-8a59-4cd58ec0a630"
