# ═══════════════════════════════════════════════════════════════
# APM.YML — AI Package Manager Config
# Entry point cho toàn bộ hệ thống skills & MCP
# ═══════════════════════════════════════════════════════════════
name: my-ai-skills
version: 2.0.0
description: Bộ kỹ năng Mobile (Android/iOS) và công cụ MCP tích hợp

# ───────────────────────────────────────────────────────────────
# SKILLS — Hướng dẫn & quy chuẩn cho AI
# Tổ chức theo features: coding / design / structure / testing / delivery
# ───────────────────────────────────────────────────────────────
skills:

  # ══════════════════════════════
  # FEATURE: coding
  # ══════════════════════════════

  # --- Dart / Flutter ---
  - name: dart-flutter-review
    description: Quy chuẩn Riverpod, Clean Architecture cho Flutter
    path: ./features/dart/skills/flutter/flutter-code-review.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-bloc-firebase
    description: "cursor.directory: Flutter + Bloc/Cubit + Firebase rules"
    path: ./features/dart/skills/flutter/rules-bloc-firebase.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-clean-arch-bloc
    description: "cursor.directory: Clean Architecture + Feature-First + flutter_bloc (with Dartz, GetIt)"
    path: ./features/dart/skills/flutter/rules-clean-arch-bloc.md
    activate:
      include: ["**/*.dart"]

  - name: dart-general-rules
    description: "cursor.directory: Senior Dart guidelines + Riverpod/getIt/AutoRoute Flutter principles"
    path: ./features/dart/skills/flutter/rules-dart-general.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-provider-bloc
    description: "cursor.directory: Provider (ephemeral) + Bloc (app state) + private widget classes"
    path: ./features/dart/skills/flutter/rules-provider-bloc.md
    activate:
      include: ["**/*.dart"]

  - name: flutter-riverpod-supabase
    description: "cursor.directory: Flutter + Riverpod + Supabase rules"
    path: ./features/dart/skills/flutter/rules-riverpod-supabase.md
    activate:
      include: ["**/*.dart"]

  - name: riverpod-patterns
    description: Riverpod patterns chuẩn cho Flutter
    path: ./features/dart/skills/flutter/riverpod-patterns.md
    activate:
      include: ["**/*.dart"]

  - name: dart-style-guide
    description: Dart style guide chung
    path: ./features/dart/skills/dart-style-guide.md
    activate:
      include: ["**/*.dart"]

  # --- Swift / iOS ---
  - name: ios-patterns
    description: iOS patterns (Swift, UIKit, SwiftUI)
    path: ./features/swift/skills/ios-patterns.md
    activate:
      include: ["**/*.swift"]

  # --- Python ---
  - name: python-review
    description: Quy chuẩn PEP8 và xử lý logic cho Python
    path: ./features/python/skills/code-review.md
    activate:
      include: ["**/*.py"]

  - name: fastapi-patterns
    description: FastAPI patterns chuẩn
    path: ./features/python/skills/fastapi-patterns.md
    activate:
      include: ["**/*.py"]

  - name: pep8-guide
    description: PEP8 style guide
    path: ./features/python/skills/pep8-guide.md
    activate:
      include: ["**/*.py"]

  # --- JavaScript / TypeScript ---
  - name: javascript-review
    description: Quy chuẩn React/TypeScript
    path: ./features/javascript/skills/react-patterns.md
    activate:
      include: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx"]

  - name: typescript-guide
    description: TypeScript best practices
    path: ./features/javascript/skills/typescript-guide.md
    activate:
      include: ["**/*.ts", "**/*.tsx"]

  # --- Workflow ---
  - name: git-workflow
    description: Quy trình Git chuẩn (branch, commit, PR)
    path: ./features/workflow/skills/git-workflow.md
    activate:
      always: true

  - name: code-review-process
    description: Quy trình review code
    path: ./features/workflow/skills/code-review-process.md
    activate:
      always: true

  - name: task-management
    description: Quản lý task & sprint
    path: ./features/workflow/skills/task-management.md
    activate:
      always: true

  # ══════════════════════════════
  # FEATURE: structure
  # ══════════════════════════════

  - name: clean-architecture
    description: Hướng dẫn Clean Architecture
    path: ./features/structure/skills/architecture/clean-architecture.md
    activate:
      always: true

  - name: design-patterns
    description: Design Patterns phổ biến
    path: ./features/structure/skills/architecture/design-patterns.md
    activate:
      always: true

  - name: microservices
    description: Microservices patterns
    path: ./features/structure/skills/architecture/microservices.md
    activate:
      always: true

  # ══════════════════════════════
  # FEATURE: testing
  # ══════════════════════════════

  - name: unit-test-guide
    description: Hướng dẫn viết unit test
    path: ./features/testing/skills/unit-test-guide.md
    activate:
      include: ["**/*_test.*", "**/*.test.*", "**/test/**"]

  - name: integration-test
    description: Hướng dẫn integration test
    path: ./features/testing/skills/integration-test.md
    activate:
      include: ["**/*_test.*", "**/*.test.*", "**/test/**"]

  - name: e2e-test
    description: Hướng dẫn E2E test
    path: ./features/testing/skills/e2e-test.md
    activate:
      include: ["**/*.e2e.*", "**/e2e/**"]

  # ══════════════════════════════
  # FEATURE: delivery
  # ══════════════════════════════

  - name: docker-guide
    description: Hướng dẫn Docker & container
    path: ./features/delivery/skills/docker-guide.md
    activate:
      include: ["**/Dockerfile", "**/docker-compose*.yml"]

  - name: cicd-pipeline
    description: CI/CD pipeline guide
    path: ./features/delivery/skills/cicd-pipeline.md
    activate:
      include: ["**/.github/workflows/*.yml"]

  - name: kubernetes
    description: Kubernetes deployment guide
    path: ./features/delivery/skills/kubernetes.md
    activate:
      include: ["**/k8s/**", "**/*.k8s.yml"]

# ───────────────────────────────────────────────────────────────
# MCP SERVERS — Công cụ cho AI sử dụng
# Docs theo feature: xem ./features/<feature>/mcps/
# ───────────────────────────────────────────────────────────────
mcpServers:

  # ══════════════════════════════
  # FEATURE: workflow — Code & Spec Tools
  # Docs: ./features/workflow/mcps/
  # ══════════════════════════════

  # OpenSpec — Spec-driven development, proposal & task tracking
  # Docs: ./features/workflow/mcps/openspec.md
  openspec:
    command: npx
    args: ["-y", "openspec-mcp"]
    transport: stdio

  # Serena — Code intelligence, symbol search, refactoring
  # Docs: ./features/workflow/mcps/serena.md
  serena:
    command: uvx
    args:
      - "--from"
      - "git+https://github.com/oraios/serena"
      - "serena"
      - "start-mcp-server"
    transport: stdio

  # Context7 — Library documentation fetcher (no hallucination)
  # Docs: ./features/workflow/mcps/context7.md
  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
    transport: stdio
    env:
      CONTEXT7_API_KEY: "ctx7sk-31f118e9-1ca9-4dfc-8a59-4cd58ec0a630"

  # GitHub — Repository management, issues, PRs (Official MCP)
  # Docs: ./features/workflow/mcps/github.md
  # github:
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   transport: stdio
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: "ghp_your_token_here"

  # Git — Local git operations (Official MCP)
  # Docs: ./features/workflow/mcps/git.md
  # git:
  #   command: uvx
  #   args: ["mcp-server-git", "--repository", "."]
  #   transport: stdio

  # ══════════════════════════════
  # FEATURE: design — UI/UX Tools
  # Docs: ./features/design/mcps/
  # ══════════════════════════════

  # UI UX Pro Max ⭐ 118k — Design intelligence (Flutter, SwiftUI, Jetpack Compose)
  # Docs: ./features/design/mcps/ui-ux-pro-max.md
  # Install: npx ui-ux-pro-max-cli init --ai claude
  # Supports: Flutter, SwiftUI, Jetpack Compose, React Native + 79 visual styles
  # (Cài thủ công vào project, không qua apm inject)

  # Stitch — UI wireframe & design generation (Google)
  # Docs: ./features/design/mcps/stitch.md
  stitch:
    serverUrl: "https://stitch.googleapis.com/mcp"
    headers:
      X-Goog-Api-Key: "YOUR_STITCH_API_KEY"

  # Fetch — Web content fetcher (design reference)
